<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>squad-harness</title>
<meta name="description" content="Preprint: governança de verificação em sistemas de agentes LLM. EN + PT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f6; --surface:#fff; --ink:#1b1a17; --ink-soft:#4a4842; --ink-faint:#726f66;
    --rule:#e4e1d8; --rule-strong:#d3cfc2; --accent:#3a4bb0; --code-bg:#f3f1ea;
    --warn-bg:#fbf3e3; --warn-ink:#7a5a12; --warn-rule:#e6cf9c;
    --serif:"Source Serif 4",Iowan Old Style,Georgia,Cambria,"Times New Roman",serif;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --measure:41rem;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#15161a; --surface:#1c1e24; --ink:#e9e7e0; --ink-soft:#b7b4ab; --ink-faint:#8a877e;
    --rule:#2c2e35; --rule-strong:#3a3d46; --accent:#a3b0ff; --code-bg:#20222a;
    --warn-bg:#2a2416; --warn-ink:#e6c884; --warn-rule:#4d421f;
  }}
  :root[data-theme="dark"]{
    --bg:#15161a; --surface:#1c1e24; --ink:#e9e7e0; --ink-soft:#b7b4ab; --ink-faint:#8a877e;
    --rule:#2c2e35; --rule-strong:#3a3d46; --accent:#a3b0ff; --code-bg:#20222a;
    --warn-bg:#2a2416; --warn-ink:#e6c884; --warn-rule:#4d421f;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
    line-height:1.66;font-size:18px}
  .bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);display:flex;
    align-items:center;gap:.75rem;justify-content:space-between;padding:.6rem 1rem}
  .bar .brand{font-family:var(--mono);font-weight:500;font-size:.82rem;color:var(--ink-soft)}
  .controls{display:flex;gap:.4rem;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:999px;overflow:hidden}
  .seg button{font-family:var(--sans);font-weight:600;font-size:.78rem;border:0;background:transparent;
    color:var(--ink-faint);padding:.32rem .7rem;cursor:pointer;line-height:1}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .iconbtn{font-family:var(--sans);font-weight:600;font-size:.82rem;border:1px solid var(--rule-strong);
    background:transparent;color:var(--ink-faint);border-radius:999px;padding:.3rem .58rem;cursor:pointer;line-height:1}
  main{max-width:var(--measure);margin:0 auto;padding:2.4rem 1.25rem 6rem}
  article h1{font-family:var(--serif);font-weight:700;font-size:2rem;line-height:1.16;
    margin:0 0 1rem;letter-spacing:-.01em;text-wrap:balance}
  article h2{font-family:var(--serif);font-weight:700;font-size:1.36rem;line-height:1.25;
    margin:2.6rem 0 .8rem;padding-top:1.4rem;border-top:1px solid var(--rule);letter-spacing:-.01em}
  article h3{font-family:var(--serif);font-weight:600;font-size:1.1rem;margin:1.8rem 0 .5rem}
  article p{margin:0 0 1.05rem}
  article a{color:var(--accent);text-underline-offset:2px}
  article ul,article ol{margin:0 0 1.1rem;padding-left:1.3rem}
  article li{margin:.3rem 0}
  article blockquote{margin:1.3rem 0;padding:.2rem 0 .2rem 1.1rem;border-left:3px solid var(--accent);
    color:var(--ink-soft);font-style:italic}
  article blockquote p:last-child{margin-bottom:0}
  article code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:.12em .38em;border-radius:.3em}
  article pre{background:var(--code-bg);border:1px solid var(--rule);border-radius:.55rem;
    padding:.9rem 1rem;overflow-x:auto;margin:1.3rem 0}
  article pre code{background:transparent;padding:0;font-size:.8rem;line-height:1.55;white-space:pre}
  article hr{border:0;border-top:1px solid var(--rule);margin:2.2rem 0}
  /* masthead: author lines right under the title render as paragraphs */
  article h1 + p{font-family:var(--sans);font-size:.95rem;color:var(--ink-soft);margin-bottom:.15rem}
  .loading{color:var(--ink-faint);font-family:var(--sans)}
  .err{font-family:var(--sans);font-size:.9rem;background:var(--warn-bg);color:var(--warn-ink);
    border:1px solid var(--warn-rule);border-radius:.6rem;padding:.8rem 1rem}
  @media (max-width:560px){body{font-size:17px}article h1{font-size:1.6rem}article h2{font-size:1.22rem}.bar .brand{display:none}}
</style>
</head>
<body>
<div class="bar">
  <span class="brand">squad-harness</span>
  <div class="controls">
    <span class="seg" role="group" aria-label="Idioma">
      <button id="lang-pt" aria-pressed="true">PT</button>
      <button id="lang-en" aria-pressed="false">EN</button>
    </span>
    <button class="iconbtn" id="theme" title="Alternar tema">◐</button>
  </div>
</div>
<main><article id="content"><p class="loading">Carregando...</p></article></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
  var content=document.getElementById('content');
  var FILE={pt:'paper.md',en:'paper.en.md'};
  function g(k,d){try{var v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
  function s(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  var cache={};
  function show(lang){
    document.getElementById('lang-pt').setAttribute('aria-pressed',String(lang==='pt'));
    document.getElementById('lang-en').setAttribute('aria-pressed',String(lang==='en'));
    try{document.documentElement.lang = lang==='pt'?'pt-BR':'en';}catch(e){}
    if(cache[lang]){content.innerHTML=cache[lang];window.scrollTo(0,0);return;}
    content.innerHTML='<p class="loading">'+(lang==='pt'?'Carregando...':'Loading...')+'</p>';
    fetch(FILE[lang],{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error(r.status); return r.text();
    }).then(function(md){
      var html = window.marked ? marked.parse(md) : md;
      cache[lang]=html; content.innerHTML=html; window.scrollTo(0,0);
    }).catch(function(e){
      content.innerHTML='<p class="err">Não consegui carregar o texto ('+e.message+'). '+
        'Abra direto: <a href="'+FILE[lang]+'">'+FILE[lang]+'</a></p>';
    });
  }
  function setLang(l){s('vfa-lang',l);show(l);}
  document.getElementById('lang-pt').addEventListener('click',function(){setLang('pt');});
  document.getElementById('lang-en').addEventListener('click',function(){setLang('en');});
  var tbtn=document.getElementById('theme'), theme=g('vfa-theme','auto');
  function applyTheme(t){
    if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);
    else document.documentElement.removeAttribute('data-theme');
    tbtn.textContent=t==='light'?'☀':(t==='dark'?'☾':'◐');
  }
  applyTheme(theme);
  tbtn.addEventListener('click',function(){
    theme=theme==='auto'?'light':(theme==='light'?'dark':'auto');s('vfa-theme',theme);applyTheme(theme);
  });
  show(g('vfa-lang','pt'));
})();
</script>
</body>
</html>
